[project]
name = "landslideguard-backend"
version = "0.1.0"
description = "LandslideGuard AI backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Django core
  "django>=5.0,<5.2",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-filter>=24.2",
  "django-cors-headers>=4.4",
  "drf-spectacular>=0.27",

  # ASGI / WebSocket / background
  "channels>=4.1",
  "daphne>=4.1",
  "celery>=5.4",
  "redis>=5.0",
  "uvicorn[standard]>=0.30",

  # DB / config
  "psycopg[binary]>=3.2",
  "dj-database-url>=2.2",
  "python-dotenv>=1.0",
  "pydantic>=2.8",

  # Data (light — no ML yet)
  "numpy>=1.26",
  "pandas>=2.2",
  "networkx>=3.4",
  "joblib>=1.4",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-django>=4.8",
  "factory-boy>=3.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py", "*_test.py"]
